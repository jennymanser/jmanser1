<!DOCTYPE html>

<body>



<button id="btn">Process String</button>

<script>
let schoolName = "Des Moines Area Community College";

function processString(inValue) {
  let str = inValue;
  console.log(str.length);
  console.log(str.toUpperCase());
  console.log(str.slice(0, 6));
}

document.getElementById("btn").addEventListener("click", function() {
    processString(schoolName);
});


let name1 = "Mary";
let name2 = "Smith";

function printName(firstname, lastname) {
  console.log(`${firstname}${lastname}`);
  console.log(`${lastname}, ${firstname}`);
  console.log(`${lastname.toUpperCase()}${firstname}`);   
}

   printName(name1, name2);

</script>

</body>
</html>
